<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체키 번역 프롬프트 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: three big tabs (게임 카드 / 프롬프트 / 용어집), a game picker row, and forms that save as you type */
:root {
  --bg: #ffffff;
  --panel: #f5f3f1;
  --line: #ddd6d1;
  --fg: #231f1c;
  --muted: #625953;
  --accent: #d24a16;
  --accent-soft: #fdece4;
  --ok: #24764a;
  --ok-soft: #e4f3ea;
  --code-bg: #faf8f6;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171412; --panel: #221e1b; --line: #3d3532; --fg: #f3eee9; --muted: #b9aea6;
    --accent: #ff8352; --accent-soft: #3b251b; --ok: #74cf9b; --ok-soft: #1d3326; --code-bg: #1c1917; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171412; --panel: #221e1b; --line: #3d3532; --fg: #f3eee9; --muted: #b9aea6;
  --accent: #ff8352; --accent-soft: #3b251b; --ok: #74cf9b; --ok-soft: #1d3326; --code-bg: #1c1917; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 26px; margin: 0; line-height: 1.3; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 15px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.saved { font-size: 14px; color: var(--muted); }
.saved.on { color: var(--ok); }

button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 9px 16px; font-size: 15px; min-height: 42px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Main tabs */
.mainnav { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 20px 0 16px; }
.mainnav button { border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 8px; font-size: 17px; font-weight: 700; color: var(--muted); }
.mainnav button span { display: block; font-size: 13px; font-weight: 400; }
.mainnav button[aria-selected="true"] { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }

/* Game picker */
.picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
.picker .label { font-size: 14px; color: var(--muted); margin-right: 4px; }
.gbtn { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 99px; padding: 8px 16px; font-size: 15px; min-height: 42px; }
.gbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.gbtn.add { border-style: dashed; color: var(--accent); border-color: var(--accent); }

/* Sections */
.section { border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
.section > h2 { font-size: 18px; margin: 0 0 4px; }
.section > .hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 14px; font-weight: 700; }
.field > small { font-size: 13px; color: var(--muted); }
input, textarea, select { font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-height: 42px; }
textarea { resize: vertical; min-height: 72px; }
input:hover, textarea:hover, select:hover { border-color: var(--muted); }
input:disabled, textarea:disabled, select:disabled { background: var(--panel); }

/* Speakers */
.sp { display: grid; grid-template-columns: 1fr 1fr 2fr 2fr auto; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
.sp:first-of-type { border-top: 0; padding-top: 0; }
@media (max-width: 760px) { .sp { grid-template-columns: 1fr 1fr; } .sp .del { grid-column: 1 / -1; justify-self: end; } }
.addrow { width: 100%; margin-top: 12px; border: 2px dashed var(--line); background: none; border-radius: 10px; padding: 10px; color: var(--accent); font-weight: 700; font-size: 15px; }
.addrow:hover { border-color: var(--accent); background: var(--accent-soft); }

/* Progress */
.prog { display: grid; gap: 12px; }
.prow { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; }
.prow b { font-size: 15px; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.steps button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 4px; font-size: 14px; color: var(--muted); min-height: 40px; }
.steps button.past { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.steps button.cur { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.steps button.cur.final { background: var(--ok); border-color: var(--ok); }
@media (max-width: 600px) { .prow { grid-template-columns: minmax(0, 1fr); gap: 6px; } .steps button { font-size: 12px; } }

/* Prompts */
.langseg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; flex-wrap: wrap; }
.langseg button { border: 0; background: var(--bg); padding: 9px 18px; font-size: 15px; color: var(--muted); min-height: 42px; }
.langseg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
.pcard { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.pcard > summary { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 14px 16px; cursor: pointer; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard > summary::before { content: "▸"; color: var(--accent); font-size: 14px; }
.pcard[open] > summary::before { content: "▾"; }
.pid { font-family: var(--font-mono); color: var(--accent); font-weight: 500; }
.pname { font-weight: 700; font-size: 16px; }
.ptool { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; }
.pcard .spacer { flex: 1; }
.why { padding: 0 16px 12px; }
.why h4 { margin: 0 0 6px; font-size: 14px; color: var(--accent); }
.why dl { margin: 0; display: grid; gap: 6px; }
.why .r { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.why dt { font-weight: 700; } .why dd { margin: 0; }
@media (max-width: 600px) { .why .r { grid-template-columns: minmax(0, 1fr); gap: 0; } }
pre.ptext { margin: 0; padding: 16px; background: var(--code-bg); border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }

/* Glossary */
.gtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.gtools input[type=search] { flex: 1 1 220px; width: auto; }
.gtools select { width: auto; }
.gtools .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; }
.gtools .chk input { width: 20px; min-height: 20px; }
.gstats { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.gstats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.g { border-collapse: collapse; width: 100%; min-width: 1120px; font-size: 14px; }
table.g th { background: var(--panel); text-align: left; font-size: 13px; color: var(--muted); font-weight: 700; padding: 10px 8px; white-space: nowrap; position: sticky; top: 0; }
table.g td { padding: 6px; border-top: 1px solid var(--line); vertical-align: top; }
table.g td input, table.g td select { min-height: 38px; padding: 7px 8px; font-size: 14px; }
.lcell { display: grid; gap: 4px; }
.st { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; font-size: 12px; padding: 2px 10px; color: var(--muted); justify-self: start; min-height: 28px; }
.st.cand { border-color: var(--accent); color: var(--accent); }
.st.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.iconbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; min-width: 38px; min-height: 38px; color: var(--muted); font-size: 14px; }
.iconbtn.warn { background: var(--accent); color: #fff; border-color: var(--accent); }
tr.detail td { background: var(--panel); }
.dgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; padding: 6px 4px; }
.dgrid .field > span { font-size: 13px; }
tr.draft td { background: var(--accent-soft); }
tfoot td { padding: 8px; border-top: 1px solid var(--line); }
tfoot .addrow { margin: 0; }

.empty { color: var(--muted); padding: 28px 12px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 15px; z-index: 20; max-width: calc(100% - 32px); }
.dangerzone { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
.csvbox { width: 100%; min-height: 150px; font-family: var(--font-mono); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.auth { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 520px; width: calc(100% - 32px); background: var(--bg); color: var(--fg); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h2 { margin: 0 0 8px; font-size: 20px; }
dialog ol { padding-left: 20px; font-size: 14px; color: var(--muted); }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.authpage { min-height: 100%; display: grid; place-items: center; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.authcard { width: 100%; max-width: 420px; border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; background: var(--bg); }
.authcard h1 { font-size: 24px; margin: 0 0 4px; }
.authcard .sub { margin: 0 0 20px; }
.tabs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
.tabs2 button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px; font-size: 15px; color: var(--muted); }
.tabs2 button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.fstack { display: grid; gap: 10px; }
.ok-msg { color: var(--ok); font-size: 14px; min-height: 1.4em; margin: 6px 0 0; }
.who { font-size: 14px; }
.who b { font-weight: 700; }
.mainnav .badge { display: inline-block; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 12px; margin-left: 6px; vertical-align: 2px; }
.ulist { display: grid; gap: 8px; }
.urow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.6fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.urow .meta { font-size: 13px; color: var(--muted); }
.urow .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.urow select { width: auto; }
@media (max-width: 700px) { .urow { grid-template-columns: minmax(0, 1fr); } .urow .acts { justify-content: flex-start; } }
.temp { font-family: var(--font-mono); background: var(--panel); padding: 2px 8px; border-radius: 6px; user-select: all; }
.err { color: var(--accent); font-size: 14px; min-height: 1.4em; margin: 6px 0 0; }
</style>
</head>
<body>


<div class="wrap" id="app" hidden>
  <div class="topline">
    <div>
      <h1>체키 번역 프롬프트 카드</h1>
      <p class="sub">게임 카드에 컨셉과 말투를 적고, 용어집을 채우면, 프롬프트 탭에서 바로 복사해 쓸 수 있어요. 입력한 내용은 자동으로 저장됩니다.</p>
    </div>
    <div class="auth"><span class="saved" id="saved" aria-live="polite"></span><span class="who" id="who"></span><button type="button" class="btn" id="pw-btn" hidden>비밀번호 변경</button><button type="button" class="btn" id="auth-btn">로그아웃</button></div>
  </div>
  <nav class="mainnav" role="tablist" aria-label="화면">
    <button type="button" role="tab" data-view="card" aria-selected="true">게임 카드<span>컨셉·말투·진행 상황</span></button>
    <button type="button" role="tab" data-view="prompts" aria-selected="false">프롬프트<span>복사해서 AI에 붙여 넣기</span></button>
    <button type="button" role="tab" data-view="glossary" aria-selected="false">용어집<span>모든 게임 공용</span></button>
    <button type="button" role="tab" data-view="admin" aria-selected="false" id="admin-tab" hidden>회원 관리<span id="admin-sub">가입 승인·권한</span></button>
  </nav>
  <div id="picker" class="picker"></div>
  <div id="content"><div class="empty">불러오는 중…</div></div>
</div>
<div class="toast" id="toast" hidden></div>
<main class="authpage" id="auth-page" hidden>
  <div class="authcard">
    <h1>체키 번역 프롬프트 카드</h1>
    <p class="sub">팀 전용 사이트예요. 로그인해 주세요.</p>
    <p class="err" id="setup-err" hidden></p>
    <div class="tabs2" role="group" aria-label="로그인 또는 회원가입"><button type="button" id="tab-login" aria-pressed="true">로그인</button><button type="button" id="tab-signup" aria-pressed="false">회원가입</button></div>
    <form id="login-form" class="fstack">
      <label class="field"><span>이메일</span><input id="li-email" type="email" autocomplete="email"></label>
      <label class="field"><span>비밀번호</span><input id="li-pw" type="password" autocomplete="current-password"></label>
      <p class="err" id="li-err"></p>
      <button type="submit" class="btn primary">로그인</button>
    </form>
    <form id="signup-form" class="fstack" hidden>
      <p style="margin:0;font-size:14px;color:var(--muted)">가입 신청 후 관리자가 승인하면 로그인할 수 있어요.</p>
      <label class="field"><span>이름</span><input id="su-name" autocomplete="name" placeholder="수정 기록에 표시돼요"></label>
      <label class="field"><span>이메일</span><input id="su-email" type="email" autocomplete="email"></label>
      <label class="field"><span>비밀번호 (8자 이상)</span><input id="su-pw" type="password" autocomplete="new-password"></label>
      <label class="field"><span>비밀번호 확인</span><input id="su-pw2" type="password" autocomplete="new-password"></label>
      <p class="err" id="su-err"></p><p class="ok-msg" id="su-ok"></p>
      <button type="submit" class="btn primary">가입 신청</button>
    </form>
  </div>
</main>
<dialog id="pwdlg">
  <form id="pw-form" class="fstack">
    <h2>비밀번호 변경</h2>
    <label class="field"><span>지금 비밀번호</span><input id="pw-cur" type="password" autocomplete="current-password"></label>
    <label class="field"><span>새 비밀번호 (8자 이상)</span><input id="pw-new" type="password" autocomplete="new-password"></label>
    <p class="err" id="pw-err"></p>
    <div class="row"><button type="button" class="btn" data-close>닫기</button><button type="submit" class="btn primary">변경</button></div>
  </form>
</dialog>
<script src="store.js"></script>

<script>
const LANGS = [
  { key: 'en', label: '영어', target: '영어', region: '영어권(미국 등)', short: 'EN' },
  { key: 'ja', label: '일본어', target: '일본어', region: '일본', short: 'JA' },
  { key: 'zh', label: '중국어(간체)', target: '중국어(간체, 중국 본토용)', region: '중국 본토', short: 'ZH' },
];
const STAGES = ['미착수', '원문 정리', '번역', '검수', '확정'];
const TYPES = ['게임명', '캐릭터명', '버튼 라벨', '지시 동사', '결과·판정 문구', '영문 표기', '기타'];

let db = null, downloads = null, readOnly = false;
let themes = [], terms = [];
let view = 'card', gameId = null, promptLang = 'en';
let gf = { q: '', game: 'all', open: false };
let drafts = [];               // unsaved new term rows
const expanded = new Set();    // term ids with detail row open
let armedDelete = null;        // id armed for delete
let csvText = '';
let pending = false;           // a render waits for the user to leave a field

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2400); }
function savedMark() { const s = $('#saved'); s.textContent = '저장됨 ✓'; s.classList.add('on'); clearTimeout(savedMark.t); savedMark.t = setTimeout(() => { s.textContent = '모든 변경 사항이 저장되어 있어요'; s.classList.remove('on'); }, 1800); }
function makeId(name) {
  const base = String(name).normalize('NFKD').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 30);
  return (base || 'item') + '-' + Math.random().toString(36).slice(2, 7);
}
function writeErr(err) {
  if (err && err.code === 'invalid_argument') { readOnly = true; toast((err && err.message) || '수정 권한이 없어요. 오른쪽 위에서 로그인해 주세요.'); render(true); return; }
  if (err && err.code === 'quota_exceeded') { toast('저장 공간이 가득 찼어요. 쓰지 않는 항목을 지워 주세요.'); return; }
  toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
}

function termsFor(themeId) { return terms.filter(x => x.data.common || (x.data.games || []).includes(themeId)); }
function trOf(term, k) { return (term.tr && term.tr[k]) || { text: '', status: '미정', avoid: '', avoidWhy: '' }; }
function statusOf(term, k) { const r = trOf(term, k); return r.text ? (r.status === '확정' ? '확정' : '후보') : '미정'; }
function themeName(id) { const t = themes.find(x => x.id === id); return t ? (t.data.name || '(이름 없음)') : ''; }
const cur = () => themes.find(t => t.id === gameId);

function cardText(t) {
  const lines = [`[게임 컨텍스트 카드: ${t.name || '(이름 없음)'}]`];
  if (t.concept) lines.push(`- 테마: ${t.concept}`);
  if (t.situation) lines.push(`- 상황: ${t.situation}`);
  (t.speakers || []).filter(s => s.who).forEach(s => {
    lines.push(`- 화자 ${s.who}${s.to ? ` → ${s.to}` : ''}: ${s.tone || ''}${s.banned ? ` / 금지: ${s.banned}` : ''}`);
  });
  if (t.honorific) lines.push(`- 존댓말·반말: ${t.honorific}`);
  const dirs = LANGS.filter(l => t.lang?.[l.key]).map(l => `  · ${l.label}: ${t.lang[l.key]}`);

function glossaryText(themeId, langKey) {
  const list = termsFor(themeId).map(x => x.data).filter(r => r.ko);
  if (!list.length) return '[용어집]\n(등록된 용어 없음)';
  const head = '[용어집] ‘확정’ 번역은 반드시 그대로 쓰고, ‘후보’는 참고만 하며, ‘금지’ 번역은 쓰지 않는다.';
  if (langKey) {
    const L = LANGS.find(l => l.key === langKey);
    return head + '\n원문 | 의도 | ' + L.label + ' | 상태 | 금지 번역\n' + list.map(r => { const x = trOf(r, langKey); return [r.ko, r.intent || '-', x.text || '-', statusOf(r, langKey), x.avoid ? x.avoid + (x.avoidWhy ? ' (' + x.avoidWhy + ')' : '') : '-'].join(' | '); }).join('\n');
  }
  return head + '\n원문 | 의도 | 영어 | 일본어 | 중국어\n' + list.map(r => [r.ko, r.intent || '-', ...LANGS.map(l => (trOf(r, l.key).text || '-') + ' [' + statusOf(r, l.key) + ']')].join(' | ')).join('\n');
}

  return D[id] || [];
}

function render(force) {
  const a = document.activeElement;
  if (!force && a && a.matches && a.matches('#content input, #content textarea, #content select')) { pending = true; return; }
  pending = false;
  document.querySelectorAll('.mainnav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
  renderPicker();
  const c = $('#content');
  if (!db) { c.innerHTML = '<div class="empty">데이터를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>'; return; }
  if (view === 'admin') { c.innerHTML = adminHTML(); return; }
  if (view === 'glossary') c.innerHTML = glossaryHTML();
  else if (!cur()) c.innerHTML = `<div class="empty">아직 게임이 없어요. 위의 <b>+ 게임 추가</b>를 눌러 첫 게임을 만들어 주세요.</div>`;
  else c.innerHTML = view === 'card' ? cardHTML(cur()) : promptsHTML(cur());
}

function filtered() {
  const q = gf.q.trim().toLowerCase();
  return terms.filter(({ data: d }) => {
    if (gf.game === 'common' && !d.common) return false;
    if (gf.game !== 'all' && gf.game !== 'common' && !(d.common || (d.games || []).includes(gf.game))) return false;
    if (gf.open && LANGS.every(l => statusOf(d, l.key) === '확정')) return false;
    if (q) { const h = [d.ko, d.intent, d.memo, ...LANGS.map(l => trOf(d, l.key).text + ' ' + trOf(d, l.key).avoid)].join(' ').toLowerCase(); if (!h.includes(q)) return false; }
    return true;
  }).sort((a, b) => (a.data.ko || '').localeCompare(b.data.ko || '', 'ko'));
}

function blankTerm() {
  const g = gf.game !== 'all' && gf.game !== 'common' ? gf.game : '';
  return { ko: '', type: '지시 동사', common: gf.game === 'common' || !g, games: g ? [g] : [], intent: '', tr: Object.fromEntries(LANGS.map(l => [l.key, { text: '', status: '후보', avoid: '', avoidWhy: '' }])), memo: '' };
}
function csvOf(list) {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['원문', '유형', '사용 게임', '의도', ...LANGS.flatMap(l => [l.label, l.label + ' 상태', l.label + ' 금지 번역', l.label + ' 금지 이유']), '메모'];
  const rows = list.map(({ data: d }) => [d.ko, d.type, d.common ? '모든 게임 공통' : (d.games || []).map(themeName).filter(Boolean).join(' / '), d.intent, ...LANGS.flatMap(l => { const x = trOf(d, l.key); return [x.text, statusOf(d, l.key), x.avoid, x.avoidWhy]; }), d.memo]);
  return '﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');
}

/* ================= events (delegated) ================= */
function setPath(obj, path, v) { const ks = path.split('.'); let o = obj; ks.slice(0, -1).forEach(k => { o[k] = o[k] ?? (/^\d+$/.test(k) ? [] : {}); o = o[k]; }); o[ks.at(-1)] = v; }
function nest(path, v) { const out = {}; setPath(out, path, v); return out; }

async function saveGameField(path, v) {
  const c = cur(); if (!c) return;
  let patch;
  if (path.startsWith('speakers.')) { const sp = JSON.parse(JSON.stringify(c.data.speakers || [])); setPath({ speakers: sp }, path, v); patch = { speakers: sp }; }
  else patch = nest(path, v);
  patch.updatedAt = new Date().toISOString();
  try { await db.doc('themes/' + c.id).update(patch); savedMark(); } catch (e) { writeErr(e); }
}
async function saveTermField(id, f, v) {
  const x = terms.find(t => t.id === id); if (!x) return;
  let patch;
  if (f === 'game') patch = v === 'common' ? { common: true, games: [] } : { common: false, games: v ? [v] : [] };
  else if (/^tr\.\w+\.text$/.test(f)) { const k = f.split('.')[1]; const old = trOf(x.data, k); patch = { tr: { [k]: { ...old, text: v, status: v ? (old.status === '확정' ? '확정' : '후보') : '미정' } } }; }
  else patch = nest(f, v);
  patch.updatedAt = new Date().toISOString();
  try { await db.doc('terms/' + id).update(patch); savedMark(); } catch (e) { writeErr(e); }
}
async function saveDraft(d) {
  const data = JSON.parse(JSON.stringify(d.data));
  LANGS.forEach(l => { const r = data.tr[l.key]; r.status = r.text ? '후보' : '미정'; });
  data.updatedAt = new Date().toISOString();
  if (terms.some(t => t.data.ko === data.ko)) toast(`‘${data.ko}’는 이미 있는 원문이에요. 필요하면 하나를 지워 주세요.`);
  const id = makeId(data.ko);
  const af = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
  const inDraft = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-draft="' + d.id + '"]');
  try {
    await db.doc('terms/' + id).set(data); drafts = drafts.filter(x => x !== d);
    terms = terms.some(t => t.id === id) ? terms : [...terms, { id, data }];
    savedMark(); render(true);
    if (af && inDraft) { const n = document.querySelector(`[data-term="${id}"] [data-f="${af}"]`); if (n) n.focus(); }
  } catch (e) { writeErr(e); }
}

document.addEventListener('change', e => {
  const el = e.target; if (readOnly) return;
  if (el.dataset.path) { saveGameField(el.dataset.path, el.value.trim()); return; }
  if (el.dataset.f) {
    const row = el.closest('[data-term],[data-draft]'); if (!row) return;
    const v = el.type === 'checkbox' ? el.checked : el.value.trim();
    if (row.dataset.term) { saveTermField(row.dataset.term, el.dataset.f, v); return; }
    const d = drafts.find(x => x.id === row.dataset.draft); if (!d) return;
    if (el.dataset.f === 'game') { d.data.common = v === 'common'; d.data.games = v && v !== 'common' ? [v] : []; }
    else setPath(d.data, el.dataset.f, v);
    if (d.data.ko) saveDraft(d);
  }
  if (el.id === 'g-game') { gf.game = el.value; render(true); }
  if (el.id === 'g-open') { gf.open = el.checked; render(true); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'g-q') { gf.q = e.target.value; const pos = e.target.selectionStart; render(true); const n = $('#g-q'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('table.g input')) { e.preventDefault(); e.target.blur(); }
});

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.closest('.mainnav')) { view = b.dataset.view; armedDelete = null; location.hash = view === 'card' || view === 'prompts' ? (gameId || '') : view; if (view === 'admin') loadAdmin(); render(true); return; }
  if (b.dataset.game) { gameId = b.dataset.game; armedDelete = null; location.hash = gameId; render(true); return; }
  if (b.id === 'add-game') {
    const id = makeId('game');
    const data = { name: '새 게임', concept: '', situation: '', honorific: '', speakers: [{ who: '', to: '플레이어', tone: '', banned: '' }], lang: { en: '', ja: '', zh: '' }, progress: { en: 0, ja: 0, zh: 0 }, memo: '', updatedAt: new Date().toISOString() };
    try { await db.doc('themes/' + id).set(data); gameId = id; view = 'card'; location.hash = id; render(true); const n = document.querySelector('[data-path="name"]'); if (n) { n.focus(); n.select(); } } catch (err) { writeErr(err); }
    return;
  }
  if (b.dataset.prog) {
    const [k, v] = b.dataset.prog.split(':'); const c = cur();
    try { await db.doc('themes/' + c.id).update({ progress: { ...(c.data.progress || {}), [k]: +v } }); savedMark(); } catch (err) { writeErr(err); }
    return;
  }
  if (b.id === 'sp-add') { const c = cur(); const sp = [...(c.data.speakers || []), { who: '', to: '플레이어', tone: '', banned: '' }]; try { await db.doc('themes/' + c.id).update({ speakers: sp }); } catch (err) { writeErr(err); } return; }
  if (b.dataset.spDel !== undefined) { const c = cur(); const sp = [...(c.data.speakers || [])]; sp.splice(+b.dataset.spDel, 1); try { await db.doc('themes/' + c.id).update({ speakers: sp }); savedMark(); } catch (err) { writeErr(err); } return; }
  if (b.id === 'game-del') { armedDelete = 'game:' + gameId; render(true); return; }
  if (b.id === 'game-del-no') { armedDelete = null; render(true); return; }
  if (b.id === 'game-del-yes') { const id = gameId; armedDelete = null; try { await db.doc('themes/' + id).delete(); gameId = null; toast('게임 카드를 삭제했어요.'); } catch (err) { writeErr(err); } return; }
  if (b.dataset.lang) { promptLang = b.dataset.lang; render(true); return; }
  if (b.dataset.copy !== undefined) {
    e.preventDefault(); e.stopPropagation();
    const pre = $('#pt-' + b.dataset.copy); const txt = pre.textContent;
    const fallback = () => { b.closest('details').open = true; const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('텍스트를 선택했어요. Ctrl+C로 복사하세요.'); };
    try { navigator.clipboard.writeText(txt).then(() => { b.textContent = '복사됨 ✓'; setTimeout(() => (b.textContent = '복사'), 1500); }, fallback); } catch { fallback(); }
    return;
  }
  if (b.id === 'g-add') { const d = { id: 'draft-' + Math.random().toString(36).slice(2, 8), data: blankTerm() }; drafts.push(d); render(true); const inp = document.querySelector(`[data-draft="${d.id}"] input[data-f="ko"]`); if (inp) inp.focus(); return; }
  if (b.dataset.more) { const id = b.dataset.more; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(true); return; }
  if (b.dataset.del) {
    const id = b.dataset.del;
    if (id.startsWith('draft-')) { drafts = drafts.filter(x => x.id !== id); render(true); return; }
    if (armedDelete !== id) { armedDelete = id; render(true); setTimeout(() => { if (armedDelete === id) { armedDelete = null; render(); } }, 4000); return; }
    armedDelete = null;
    try { await db.doc('terms/' + id).delete(); toast('용어를 삭제했어요.'); } catch (err) { writeErr(err); }
    return;
  }
  if (b.dataset.st) {
    const row = b.closest('[data-term]'); const x = terms.find(t => t.id === row.dataset.term); const k = b.dataset.st; const old = trOf(x.data, k);
    try { await db.doc('terms/' + x.id).update({ tr: { [k]: { ...old, status: old.status === '확정' ? '후보' : '확정' } }, updatedAt: new Date().toISOString() }); savedMark(); } catch (err) { writeErr(err); }
    return;
  }
  if (b.id === 'g-csv') {
    const csv = csvOf(filtered());
    if (downloads) { try { await downloads.save({ filename: '체키_번역_용어집.csv', data: csv }); toast('CSV 파일을 저장했어요.'); return; } catch (err) { if (err && err.code === 'declined') return; } }
    csvText = csv.replace(/^﻿/, ''); render(true); const ta = $('#csv-text'); if (ta) ta.select(); return;
  }
  if (b.id === 'csv-close') { csvText = ''; render(true); return; }
});

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h === 'glossary') { if (view !== 'glossary') { view = 'glossary'; render(true); } }
  else if (h === 'admin') { /* 탭에서만 이동 */ }
  else if (h && themes.some(t => t.id === h) && h !== gameId) { gameId = h; if (view === 'glossary') view = 'card'; render(true); }
});

/* ================= 로그인·회원 ================= */
function showAuthPage(msg) {
  $('#app').hidden = true; $('#auth-page').hidden = false;
  if (msg) { $('#setup-err').hidden = false; $('#setup-err').textContent = msg; }
  dlgTab('login');
}
function dlgTab(which) {
  $('#tab-login').setAttribute('aria-pressed', String(which === 'login'));
  $('#tab-signup').setAttribute('aria-pressed', String(which === 'signup'));
  $('#login-form').hidden = which !== 'login'; $('#signup-form').hidden = which !== 'signup';
  ['li-err', 'su-err', 'su-ok'].forEach(id => ($('#' + id).textContent = ''));
  (which === 'login' ? $('#li-email') : $('#su-name')).focus();
}
function openLogin() { showAuthPage(); }
function setupAuth(me) {
  $('#who').innerHTML = !me.loggedIn ? '' : me.role === 'admin' ? '<b>관리자</b>' : `<b>${esc(me.name)}</b> · ${me.role === 'editor' ? '편집자' : '보기 전용'}`;
  $('#pw-btn').hidden = !me.loggedIn || me.role === 'admin';

  $('#admin-tab').hidden = !me.isAdmin;
  if (me.isAdmin && me.pending) $('#admin-sub').innerHTML = `승인 대기<span class="badge">${me.pending}</span>`;
  $('#auth-btn').onclick = async () => {
    if (Store.pending()) { toast('저장 중인 내용이 있어요. 잠시 후 다시 눌러 주세요.'); return; }
    await Store.logout(); location.reload();
  };
  $('#pw-btn').onclick = () => { $('#pw-err').textContent = ''; $('#pw-cur').value = ''; $('#pw-new').value = ''; $('#pwdlg').showModal(); $('#pw-cur').focus(); };
  $('#tab-login').onclick = () => dlgTab('login');
  $('#tab-signup').onclick = () => dlgTab('signup');
  document.querySelectorAll('dialog [data-close]').forEach(b => (b.onclick = () => b.closest('dialog').close()));
  $('#login-form').onsubmit = async e => {
    e.preventDefault();
    $('#li-err').textContent = '확인 중…';
    try { await Store.login($('#li-email').value.trim(), $('#li-pw').value); location.reload(); }
    catch (err) { $('#li-err').textContent = err.message; }
  };
  $('#signup-form').onsubmit = async e => {
    e.preventDefault();
    $('#su-ok').textContent = '';
    if ($('#su-pw').value !== $('#su-pw2').value) { $('#su-err').textContent = '비밀번호 확인이 맞지 않아요.'; return; }
    $('#su-err').textContent = '보내는 중…';
    try { const r = await Store.signup($('#su-name').value.trim(), $('#su-email').value.trim(), $('#su-pw').value); $('#su-err').textContent = ''; $('#su-ok').textContent = r.message; e.target.reset(); }
    catch (err) { $('#su-err').textContent = err.message; }
  };
  $('#pw-form').onsubmit = async e => {
    e.preventDefault();
    try { await Store.changePassword($('#pw-cur').value, $('#pw-new').value); $('#pwdlg').close(); toast('비밀번호를 바꿨어요.'); }
    catch (err) { $('#pw-err').textContent = err.message; }
  };
}

/* ---------- 회원 관리 (관리자) ---------- */
let adminUsers = null, adminErr = '', tempShown = null;
async function loadAdmin() {
  try { adminUsers = await Store.adminUsers(); adminErr = ''; } catch (e) { adminErr = e.message; }
  if (view === 'admin') render(true);
}
const fmtDate = s => s ? new Date(s).toLocaleDateString('ko-KR') : '';
function adminHTML() {
  if (adminErr) return `<div class="empty">${esc(adminErr)}</div>`;
  if (!adminUsers) return '<div class="empty">회원 목록을 불러오는 중…</div>';
  const pend = adminUsers.filter(u => u.status === 'pending'), ok = adminUsers.filter(u => u.status === 'approved'), blk = adminUsers.filter(u => u.status === 'blocked');
  const row = (u, acts) => `<div class="urow"><div><b>${esc(u.name)}</b><div class="meta">${esc(u.email)}</div></div><div class="meta">가입 신청 ${fmtDate(u.createdAt)}${u.approvedAt ? ` · 승인 ${fmtDate(u.approvedAt)}` : ''}</div><div class="acts">${acts}</div></div>`;
  return `
  ${tempShown ? `<div class="section" style="border-color:var(--ok)"><h2>임시 비밀번호</h2><p class="hint">${esc(tempShown.name)} 님에게 전달하세요. 이 화면을 벗어나면 다시 볼 수 없어요. 로그인 후 ‘비밀번호 변경’으로 바꾸게 해 주세요.</p><p><span class="temp">${esc(tempShown.pw)}</span></p><div class="dangerzone"><button type="button" class="btn" data-ua="hide-temp">닫기</button></div></div>` : ''}
  <section class="section"><h2>승인 대기 ${pend.length ? `<span class="badge">${pend.length}</span>` : ''}</h2><p class="hint">편집자는 게임 카드와 용어집을 고칠 수 있고, 보기 전용은 읽고 프롬프트만 복사할 수 있어요.</p>
    <div class="ulist">${pend.length ? pend.map(u => row(u, `<button type="button" class="btn primary" data-ua="approve:editor" data-uid="${esc(u.id)}">편집자로 승인</button><button type="button" class="btn" data-ua="approve:viewer" data-uid="${esc(u.id)}">보기 전용으로 승인</button><button type="button" class="btn danger" data-ua="delete" data-uid="${esc(u.id)}">거절</button>`)).join('') : '<p class="hint">대기 중인 신청이 없어요.</p>'}</div></section>
  <section class="section"><h2>승인된 회원 (${ok.length})</h2>
    <div class="ulist">${ok.length ? ok.map(u => row(u, `<select data-urole="${esc(u.id)}" aria-label="${esc(u.name)} 권한"><option value="editor" ${u.role === 'editor' ? 'selected' : ''}>편집자</option><option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>보기 전용</option></select><button type="button" class="btn" data-ua="reset" data-uid="${esc(u.id)}">비밀번호 초기화</button><button type="button" class="btn danger" data-ua="block" data-uid="${esc(u.id)}">사용 중지</button>`)).join('') : '<p class="hint">아직 승인된 회원이 없어요.</p>'}</div></section>
  ${blk.length ? `<section class="section"><h2>사용 중지 (${blk.length})</h2><div class="ulist">${blk.map(u => row(u, `<button type="button" class="btn" data-ua="approve:${u.role === 'editor' ? 'editor' : 'viewer'}" data-uid="${esc(u.id)}">다시 사용</button><button type="button" class="btn danger" data-ua="delete" data-uid="${esc(u.id)}">삭제</button>`)).join('')}</div></section>` : ''}`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-ua]'); if (!b) return;
  const act = b.dataset.ua;
  if (act === 'hide-temp') { tempShown = null; render(true); return; }
  const [action, role] = act.split(':');
  if ((action === 'delete' || action === 'block') && b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '한 번 더 누르면 실행'; return; }
  b.disabled = true;
  try {
    const r = await Store.adminAction(b.dataset.uid, action, role);
    if (r.tempPassword) tempShown = { name: r.name, pw: r.tempPassword };
    toast({ approve: '승인했어요.', delete: '삭제했어요.', block: '사용을 중지했어요.', reset: '임시 비밀번호를 만들었어요.' }[action] || '처리했어요.');
    await loadAdmin();
  } catch (err) { toast(err.message); b.disabled = false; }
});
document.addEventListener('change', async e => {
  const sel = e.target.closest('[data-urole]'); if (!sel) return;
  try { await Store.adminAction(sel.dataset.urole, 'role', sel.value); toast('권한을 바꿨어요.'); await loadAdmin(); } catch (err) { toast(err.message); }
});
window.addEventListener('store-save-error', e => { const err = e.detail || {}; if (err.code === 'invalid_argument') { readOnly = true; render(true); } toast(err.message || '저장하지 못했어요.'); });
window.addEventListener('store-need-view', () => showAuthPage('로그인이 풀렸어요. 다시 로그인해 주세요.'));

/* ================= boot ================= */
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) { $('#app').hidden = false; render(true); return; }
  try { const user = await window.claude.use('user'); if (user && typeof user.can === 'function' && (await user.can('data.write')) === false) readOnly = true; } catch {}
  window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  const h = location.hash.slice(1);
  if (h === 'glossary') view = 'glossary';
  const me = await Store.me();
  $('#saved').textContent = me.setupError ? '서버 설정 필요' : !me.loggedIn ? '' : readOnly ? '보기 전용' : '입력하면 자동 저장';
  setupAuth(me);
  if (me.setupError) { showAuthPage(me.setupError); return; }
  if (me.offline) { showAuthPage('서버에 연결하지 못했어요. 잠시 후 새로고침해 주세요. (무료 서버는 처음 열 때 1분 정도 걸릴 수 있어요)'); return; }
  if (!me.loggedIn) { showAuthPage(); return; }
  $('#app').hidden = false;
  if (h === 'admin' && me.isAdmin) { view = 'admin'; loadAdmin(); }
  db.collection('themes').onSnapshot(snap => {
    themes = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, data: d.data() })).sort((a, b) => (a.data.name || '').localeCompare(b.data.name || '', 'ko'));
    if (!gameId && h && themes.some(t => t.id === h)) gameId = h;
    if (!gameId || !themes.some(t => t.id === gameId)) gameId = themes[0]?.id ?? null;
    render();
  }, () => toast('게임 목록을 불러오지 못했어요. 새로고침해 주세요.'));
  db.collection('terms').onSnapshot(snap => {
    terms = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, data: d.data() }));
    render();
  }, () => toast('용어집을 불러오지 못했어요. 새로고침해 주세요.'));
})();
</script>
